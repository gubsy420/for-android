# Fork addition: builds a debug APK of the fork.
#
# Runs on demand, and automatically after a successful upstream sync so every
# upstream update produces a fresh APK with self-hosted support included.
# Syncs that brought no new commits skip the build (the "latest" release
# already points at the current commit).
#
# Note: the checked-in google-services.json.example is used, so Firebase push
# notifications are not functional in these CI builds. Provide repository
# variables/secrets and a real google-services.json for production builds.
name: Build fork APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # For workflow_run triggers, only build if the sync succeeded
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Check whether a build is needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          RELEASED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .target_commitish 2>/dev/null || echo none)
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$RELEASED_SHA" = "$HEAD_SHA" ]; then
            echo "Release already built from $HEAD_SHA; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        if: steps.gate.outputs.build == 'true'
        uses: android-actions/setup-android@v3

      - name: Create build configuration
        if: steps.gate.outputs.build == 'true'
        run: |
          cat > stoatbuild.properties <<'EOF'
          build.debug.app_name=Stoat Self-Hosted (Debug)
          sentry.dsn=
          build.flavour_id=selfhosted-fork
          sentry.upload_mappings=false
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      # Note: the committed .github/debug.keystore is applied via the debug
      # signingConfig in app/build.gradle.kts (copying it to ~/.android does not
      # work — AGP regenerates its own key there on CI runners).

      - name: Grant execute permission for gradlew
        if: steps.gate.outputs.build == 'true'
        run: chmod +x gradlew

      - name: Build with Gradle
        if: steps.gate.outputs.build == 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Archive debug APK
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        # A dated tag per build: Obtainium sees a new version string each time,
        # and GitHub's native "latest" URL stays stable:
        # https://github.com/<owner>/<repo>/releases/latest/download/app-debug.apk
        # Older build releases are pruned, keeping the most recent 10.
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo unknown)
          TAG="v$VERSION-$(date -u +%Y.%m.%d)-${HEAD_SHA::7}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --target "$HEAD_SHA" \
            --title "Stoat $VERSION self-hosted fork ($(date -u +%Y-%m-%d))" \
            --notes "Automated debug build of commit ${HEAD_SHA::7} with self-hosted server support. Built $(date -u '+%Y-%m-%d %H:%M UTC')."

          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r OLD; do
            echo "Pruning old release $OLD"
            gh release delete "$OLD" --cleanup-tag --yes || true
          done
