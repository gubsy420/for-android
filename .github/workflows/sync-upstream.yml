# Fork addition: keeps this fork up to date with the official Stoat for-android repo
# while retaining the self-hosted server functionality.
#
# - Runs daily (and on demand via the Actions tab).
# - If upstream's dev branch has new commits, it merges them into this fork's dev.
# - If the merge is clean, it is pushed directly.
# - If there is a conflict, the resolve-conflicts job attempts an automated
#   resolution with Claude Code (using the CLAUDE_CODE_OAUTH_TOKEN secret),
#   verifies the result compiles, pushes it, and posts an issue describing what
#   was done. If any of that fails, it falls back to pushing upstream's state to
#   an `upstream-sync` branch and opening a PR for manual resolution.
name: Sync upstream

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/stoatchat/for-android.git
  UPSTREAM_BRANCH: dev
  FORK_BRANCH: dev

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.merge.outputs.result || 'up-to-date' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commit(s) ahead"

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged branch
        if: steps.merge.outputs.result == 'merged'
        run: git push origin "$FORK_BRANCH"

  # Conflicts are handed to Claude Code for automated resolution. The merge is
  # only pushed if no conflict markers remain and the merged code compiles;
  # otherwise the job fails over to a manual-resolution PR.
  resolve-conflicts:
    needs: sync
    if: needs.sync.outputs.result == 'conflict'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Recreate conflicted merge
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          git merge --no-edit "upstream/$UPSTREAM_BRANCH" || true
          git status --short

      - name: Resolve conflicts with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A git merge of upstream/${{ env.UPSTREAM_BRANCH }} into this fork's
            ${{ env.FORK_BRANCH }} branch is in progress in this checkout, with
            unresolved conflicts (`git status` lists them).

            This fork adds self-hosted server support to the upstream Stoat
            Android app. FORK_NOTES.md in the repository root documents exactly
            which files the fork modifies and what must be preserved.

            Resolve every conflicted file so that:
            1. Upstream's changes are adopted — this fork tracks upstream closely
               and must not lag behind or revert upstream work.
            2. The fork's self-hosted functionality is fully preserved: the
               endpoint delegation in Constants.kt, the startup hydration in
               StoatApplication.kt, the login/selfhosted route and greeting-screen
               link, the SelfHostedServerScreenViewModel registration, and the
               self_hosted_* string resources.
            3. The result is syntactically valid Kotlin/XML that will compile.

            Stage each resolved file with `git add`. Do NOT commit, push, or
            create branches.

            Finally, write a concise summary of what conflicted and how you
            resolved each conflict to a new file MERGE_SUMMARY.md in the
            repository root. Do NOT stage MERGE_SUMMARY.md.
          claude_args: '--allowedTools "Read,Edit,Write,Grep,Glob,Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git log:*),Bash(git show:*)" --max-turns 80'

      - name: Verify resolution and commit
        run: |
          if [ -n "$(git ls-files -u)" ]; then
            echo "Unresolved conflicts remain"; exit 1
          fi
          if git diff --cached --name-only | xargs -r grep -l "^<<<<<<< " 2>/dev/null; then
            echo "Conflict markers remain in staged files"; exit 1
          fi
          git commit --no-edit

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify merged code compiles
        run: |
          cat > stoatbuild.properties <<'EOF'
          build.debug.app_name=Stoat Self-Hosted (Debug)
          sentry.dsn=
          build.flavour_id=selfhosted-fork
          sentry.upload_mappings=false
          EOF
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi
          chmod +x gradlew
          ./gradlew --no-daemon :core:model:compileDebugKotlin :app:compileDebugKotlin

      - name: Push resolved merge
        run: git push origin "$FORK_BRANCH"

      - name: Post resolution summary issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@gubsy420 — upstream sync hit merge conflicts, which were resolved automatically by Claude Code, verified to compile, and pushed to \`$FORK_BRANCH\`."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Merge commit"
            echo '```'
            git show --stat --format="%H%n%s" HEAD
            echo '```'
            echo
            echo "## Resolution summary"
            cat MERGE_SUMMARY.md 2>/dev/null || echo "_No summary file was produced._"
          } > /tmp/issue-body.md
          gh issue create \
            --title "Upstream sync: conflicts auto-resolved ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/issue-body.md

      - name: Fall back to manual-resolution PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge --abort 2>/dev/null || true
          git reset --hard "origin/$FORK_BRANCH"
          git checkout -B upstream-sync "upstream/$UPSTREAM_BRANCH"
          git push -f origin upstream-sync

          EXISTING=$(gh pr list --head upstream-sync --base "$FORK_BRANCH" --state open --json number --jq length)
          if [ "$EXISTING" = "0" ]; then
            gh pr create \
              --head upstream-sync \
              --base "$FORK_BRANCH" \
              --title "Sync upstream (manual conflict resolution required)" \
              --body "Automatic merge of upstream \`$UPSTREAM_BRANCH\` failed due to conflicts, and automated resolution also failed (see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Resolve the conflicts in this PR, making sure the self-hosted server functionality is retained (see FORK_NOTES.md), then merge."
          else
            echo "Conflict PR already open, branch updated."
          fi
