# Fork addition: builds a patched Stoat backend pushd image with aes128gcm web
# push encoding (required for UnifiedPush; see selfhost/README.md), and pushes
# it to this fork owner's GHCR as ghcr.io/<owner>/pushd:<ref>-aes128gcm.
#
# Manual trigger only — run it when you deploy a new backend version.
name: Build patched pushd image

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "stoatchat/stoatchat tag or branch to build (match your compose version)"
        required: true
        default: "v0.13.8"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend source
        uses: actions/checkout@v4
        with:
          repository: stoatchat/stoatchat
          ref: ${{ inputs.backend_ref }}

      - name: Apply aes128gcm patch
        run: |
          FILE=crates/daemons/pushd/src/consumers/outbound/vapid.rs
          grep -q "ContentEncoding::AesGcm" "$FILE" || { echo "Pattern not found — upstream changed, update this workflow"; exit 1; }
          sed -i 's/ContentEncoding::AesGcm/ContentEncoding::Aes128Gcm/' "$FILE"
          grep -q "ContentEncoding::Aes128Gcm" "$FILE"
          echo "Patch applied:"
          grep -n "set_payload" "$FILE"

      - name: Free runner disk space and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune -af
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          df -h /; free -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pushd image
        # Upstream's Dockerfile builds every crate in the workspace with 10
        # parallel jobs, which exhausts the hosted runner. Build only the pushd
        # package with limited parallelism instead, using the same rust base and
        # a bookworm runtime for matching glibc.
        run: |
          cat > Dockerfile.pushd <<'EOF'
          FROM rust:1.92.0-slim-bookworm AS builder
          WORKDIR /src
          RUN apt-get update && apt-get install -y make pkg-config libssl-dev && rm -rf /var/lib/apt/lists/*
          COPY . .
          RUN cargo build --release --package revolt-pushd --jobs 2
          FROM debian:12-slim
          RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/* && \
              adduser --system --no-create-home pushd
          USER pushd
          COPY --from=builder /src/target/release/revolt-pushd /revolt-pushd
          CMD ["/revolt-pushd"]
          EOF
          IMAGE="ghcr.io/${{ github.repository_owner }}/pushd:${{ inputs.backend_ref }}-aes128gcm"
          docker build -t "$IMAGE" -f Dockerfile.pushd .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
